# portal-web: static page + /api/* forwarding. Read-only root filesystem: everything nginx writes lives in /tmp.
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    proxy_temp_path /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;
    charset_types text/css application/javascript application/json image/svg+xml;

    # JSON lines like every other component (no query strings, no headers, no client addresses).
    log_format portal escape=json '{"ts":"$time_iso8601","level":"info","component":"portal-web","logger":"nginx",'
                                  '"msg":"request","method":"$request_method","path":"$uri","status":$status,'
                                  '"bytes":$body_bytes_sent,"sec":$request_time,"upstream_sec":"$upstream_response_time",'
                                  '"rid":"$request_id"}';
    access_log /dev/stdout portal;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # rendered from /etc/nginx/templates/*.template at start-up (NGINX_ENVSUBST_OUTPUT_DIR)
    include /tmp/nginx/conf.d/*.conf;
}
