# Shared settings for the /api/* locations. The sign-in header from the auth proxy in front is passed on as is.
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Authorization $http_authorization;
proxy_set_header Cookie "";
proxy_set_header X-Request-Id $request_id;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $portal_forwarded_proto;
proxy_set_header X-Forwarded-Host $host;
proxy_connect_timeout 5s;
proxy_send_timeout 30s;
proxy_buffering on;
proxy_intercept_errors off;
error_page 502 504 = @upstream_down;
error_page 413 = @too_large;  # error_page here replaces the server-level one, so repeat it
