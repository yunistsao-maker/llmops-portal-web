<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>LLMOps Portal</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/app.css">
<script src="/assets/theme.js"></script>
<script src="/assets/app.js" defer></script>
</head>
<body>
<header class="top"><div class="top-in">
  <a class="brandname" href="#home">LLMOps Portal</a>
  <nav class="nav" id="nav"></nav>
  <span class="asof" id="asof"></span>
  <div class="lang" role="group" id="lang"><button type="button" data-lang="zh">中文</button><button type="button" data-lang="en">EN</button></div>
  <details class="ui-pick" id="ui-pick"><summary id="ui-sum" aria-label="外觀"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 2-.9 2-2 0-.5-.2-1-.5-1.3-.3-.4-.5-.8-.5-1.3 0-1.1.9-2 2-2h2.4c2.8 0 5-2.2 5-5C22.4 6.1 17.7 3 12 3z"/><circle cx="7.5" cy="10.5" r="1"/><circle cx="10.5" cy="7" r="1"/><circle cx="15" cy="7.5" r="1"/></svg></summary>
    <div class="ui-pop"><div class="ui-h" id="ui-h">外觀</div><div role="group" aria-labelledby="ui-h"><button type="button" data-ui="dark" aria-pressed="false"><span class="sw sw-dark" aria-hidden="true"></span><span class="ui-l">深色</span></button><button type="button" data-ui="light" aria-pressed="false"><span class="sw sw-light" aria-hidden="true"></span><span class="ui-l">白色</span></button><button type="button" data-ui="beige" aria-pressed="false"><span class="sw sw-beige" aria-hidden="true"></span><span class="ui-l">米色</span></button></div></div></details>
</div></header>
<main id="app" tabindex="-1"><div class="state" role="status"><span class="spinner" aria-hidden="true"></span><span>正在載入 portal 資料… / Loading…</span></div></main>
<noscript><div class="banner">這個頁面需要 JavaScript。This page needs JavaScript.</div></noscript>
<footer class="foot" id="foot"></footer>

<button type="button" class="chat-fab" id="chat-fab" aria-controls="chat" aria-expanded="false" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-4.9A8 8 0 1 1 21 12z"/></svg><span id="chat-fab-l"></span></button>
<section class="chat" id="chat" role="dialog" aria-modal="false" aria-labelledby="chat-h" hidden>
  <div class="chat-head"><h2 id="chat-h"></h2><button type="button" class="chat-x" id="chat-x"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="chat-log" id="chat-log" role="log" aria-live="polite"></div>
  <div class="chat-sugg" id="chat-sugg"></div>
  <form class="chat-form" id="chat-form"><label class="sr" for="chat-in" id="chat-in-l"></label><textarea id="chat-in" rows="2"></textarea>
    <div class="chat-btns"><button type="button" class="btn" id="chat-stop" hidden></button><button type="submit" class="btn primary" id="chat-send"></button></div></form>
</section>
</body>
</html>
